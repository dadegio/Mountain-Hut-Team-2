name: E2E tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mountain-hut-server/package-lock.json
            mountain-hut-client/package-lock.json

      # ---- backend ----
      - name: Install server dependencies
        working-directory: mountain-hut-server
        run: npm ci

      - name: Create and seed database
        working-directory: mountain-hut-server
        run: |
          cp .env.template .env
          npm run db:init
          npm run db:seed

      - name: Start server in background
        working-directory: mountain-hut-server
        run: npx tsx src/server.ts > server.log 2>&1 &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:3000/ && exit 0
            sleep 2
          done
          echo "Server did not start"
          cat mountain-hut-server/server.log
          exit 1

      # ---- frontend + Playwright ----
      - name: Install client dependencies
        working-directory: mountain-hut-client
        run: npm ci

      - name: Install Playwright browser
        working-directory: mountain-hut-client
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: mountain-hut-client
        run: npx playwright test

      # ---- debugging help when something fails ----
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: mountain-hut-client/playwright-report
          retention-days: 7

      - name: Show server log
        if: failure()
        run: cat mountain-hut-server/server.log